<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  user-select: none;
}

.game-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 780px;
  padding: 10px 20px;
  background: #16213e;
  border: 2px solid #0f3460;
  border-radius: 8px;
  color: #e94560;
}

.game-header .title {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 4px;
  color: #f5c518;
  text-shadow: 0 0 10px rgba(245, 197, 24, 0.5);
}

.game-header .stats {
  display: flex;
  gap: 24px;
  font-size: 15px;
}

.game-header .stats span {
  color: #fff;
  font-weight: bold;
}

canvas {
  border: 3px solid #0f3460;
  border-radius: 4px;
  background: #0a0a0a;
  display: block;
}

.game-footer {
  width: 780px;
  display: flex;
  justify-content: space-between;
  color: #888;
  font-size: 13px;
  padding: 0 10px;
}

.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.7);
  z-index: 10;
}

.overlay.hidden { display: none; }

.overlay-box {
  background: #16213e;
  border: 2px solid #0f3460;
  border-radius: 12px;
  padding: 40px 50px;
  text-align: center;
  color: #fff;
}

.overlay-box h2 {
  font-size: 32px;
  margin-bottom: 16px;
  color: #f5c518;
  letter-spacing: 4px;
}

.overlay-box p {
  font-size: 16px;
  color: #aaa;
  margin-bottom: 20px;
  line-height: 1.6;
}

.overlay-box .key-hint {
  display: inline-block;
  background: #0f3460;
  color: #f5c518;
  padding: 4px 10px;
  border-radius: 4px;
  margin: 0 3px;
  font-weight: bold;
  font-size: 14px;
}

.overlay-box button {
  background: #e94560;
  color: #fff;
  border: none;
  padding: 12px 36px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  letter-spacing: 2px;
  margin-top: 12px;
  transition: background 0.2s;
}

.overlay-box button:hover {
  background: #ff6b81;
}

.final-score {
  font-size: 48px !important;
  color: #f5c518 !important;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="game-header">
    <div class="title">⚔ 坦 克 大 战 ⚔</div>
    <div class="stats">
      分数: <span id="score">0</span>
      生命: <span id="lives">❤❤❤</span>
      击杀: <span id="kills">0</span>
    </div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div class="game-footer">
    <span>方向键/WASD 移动</span>
    <span>空格/J 射击</span>
    <span>P 暂停</span>
  </div>
</div>

<div class="overlay" id="startOverlay">
  <div class="overlay-box">
    <h2>坦 克 大 战</h2>
    <p>
      <span class="key-hint">↑↓←→</span> 或 <span class="key-hint">WASD</span> 移动坦克<br>
      <span class="key-hint">空格</span> 或 <span class="key-hint">J</span> 发射炮弹<br>
      <span class="key-hint">P</span> 暂停游戏<br>
      消灭所有敌方坦克即可获胜！
    </p>
    <button onclick="startGame()">开始战斗</button>
  </div>
</div>

<div class="overlay hidden" id="gameOverOverlay">
  <div class="overlay-box">
    <h2 id="gameOverTitle">战斗结束</h2>
    <p class="final-score" id="finalScore">0</p>
    <p id="gameOverMsg"></p>
    <button onclick="startGame()">再来一局</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const W = 780, H = 580;
canvas.width = W;
canvas.height = H;

const TILE = 40;
const COLS = W / TILE;
const ROWS = H / TILE;

// --- Game State ---
let game = {
  running: false,
  paused: false,
  score: 0,
  lives: 3,
  kills: 0,
  level: 1,
  enemiesRemaining: 0,
  enemySpawnTimer: 0,
  enemySpawnInterval: 180,
  maxEnemies: 4,
  totalEnemiesToKill: 12,
  enemiesKilledThisLevel: 0,
};

let player, enemies, bullets, walls, explosions, powerUps;
let keys = {};
let frameCount = 0;

// --- Tank Class ---
class Tank {
  constructor(x, y, dir, color, speed = 2, isPlayer = false) {
    this.x = x; this.y = y;
    this.dir = dir;
    this.color = color;
    this.speed = speed;
    this.isPlayer = isPlayer;
    this.size = TILE - 6;
    this.half = this.size / 2;
    this.shootCooldown = 0;
    this.shootDelay = isPlayer ? 20 : 80;
    this.aiTimer = 0;
    this.aiChangeDir = 60;
    this.alive = true;
  }

  collidesWith(other) {
    const dx = this.x - other.x;
    const dy = this.y - other.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    return dist < this.size * 0.8;
  }

  hitsWall() {
    for (const w of walls) {
      if (w.active && this.x - this.half < w.x + w.w &&
          this.x + this.half > w.x &&
          this.y - this.half < w.y + w.h &&
          this.y + this.half > w.y) {
        return w;
      }
    }
    return null;
  }

  wouldHitWall(nx, ny) {
    for (const w of walls) {
      if (w.active && nx - this.half < w.x + w.w &&
          nx + this.half > w.x &&
          ny - this.half < w.y + w.h &&
          ny + this.half > w.y) {
        return w;
      }
    }
    return null;
  }

  move(dx, dy, ndir) {
    let nx = this.x + dx * this.speed;
    let ny = this.y + dy * this.speed;
    this.dir = ndir;

    nx = Math.max(this.half, Math.min(W - this.half, nx));
    ny = Math.max(this.half, Math.min(H - this.half, ny));

    if (!this.wouldHitWall(nx, ny)) {
      this.x = nx;
      this.y = ny;
    }
  }

  shoot() {
    if (this.shootCooldown > 0) return null;
    this.shootCooldown = this.shootDelay;
    const speed = 5;
    let bx = this.x, by = this.y;
    const offset = this.half + 4;
    if (this.dir === 'up') { by -= offset; return new Bullet(bx, by, 0, -speed, this); }
    if (this.dir === 'down') { by += offset; return new Bullet(bx, by, 0, speed, this); }
    if (this.dir === 'left') { bx -= offset; return new Bullet(bx, by, -speed, 0, this); }
    if (this.dir === 'right') { bx += offset; return new Bullet(bx, by, speed, 0, this); }
    return null;
  }

  update() {
    if (this.shootCooldown > 0) this.shootCooldown--;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    let angle = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 }[this.dir];
    ctx.rotate(angle);

    // Tank body
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.half, -this.half + 4, this.size, this.size - 8);

    // Tracks
    ctx.fillStyle = '#222';
    ctx.fillRect(-this.half - 4, -this.half, 6, this.size);
    ctx.fillRect(this.half - 2, -this.half, 6, this.size);

    // Track details
    ctx.fillStyle = '#444';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(-this.half - 3, -this.half + 4 + i * 10, 4, 5);
      ctx.fillRect(this.half - 1, -this.half + 4 + i * 10, 4, 5);
    }

    // Turret (barrel)
    ctx.fillStyle = this.isPlayer ? '#5eff5e' : '#ff5e5e';
    ctx.fillRect(-4, -this.half - 6, 8, 20);
    ctx.fillStyle = this.isPlayer ? '#3a3' : '#a33';
    ctx.fillRect(-2, -this.half - 8, 4, 22);

    // Center circle
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI * 2);
    ctx.fillStyle = this.isPlayer ? '#ff0' : '#f88';
    ctx.fill();

    ctx.restore();
  }

  aiUpdate() {
    this.aiTimer++;
    if (this.aiTimer >= this.aiChangeDir) {
      this.aiTimer = 0;
      this.aiChangeDir = 40 + Math.floor(Math.random() * 80);
      const dirs = ['up', 'down', 'left', 'right'];
      this.dir = dirs[Math.floor(Math.random() * 4)];

      if (Math.random() < 0.4) {
        const b = this.shoot();
        if (b) bullets.push(b);
      }
    }

    const mv = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const [mx, my] = mv[this.dir];
    let canMove = !this.wouldHitWall(this.x + mx * this.speed, this.y + my * this.speed);
    let inBounds = this.x + mx * this.speed > this.half &&
                   this.x + mx * this.speed < W - this.half &&
                   this.y + my * this.speed > this.half &&
                   this.y + my * this.speed < H - this.half;

    if (canMove && inBounds) {
      this.x += mx * this.speed;
      this.y += my * this.speed;
    } else {
      this.aiTimer = this.aiChangeDir;
    }
  }
}

// --- Bullet Class ---
class Bullet {
  constructor(x, y, dx, dy, owner) {
    this.x = x; this.y = y;
    this.dx = dx; this.dy = dy;
    this.owner = owner;
    this.alive = true;
    this.r = 3;
  }

  update() {
    this.x += this.dx;
    this.y += this.dy;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) {
      this.alive = false;
      return;
    }
    for (const w of walls) {
      if (w.active && this.x > w.x && this.x < w.x + w.w &&
          this.y > w.y && this.y < w.y + w.h) {
        this.alive = false;
        w.active = false;
        explosions.push(new Explosion(w.x + w.w/2, w.y + w.h/2, '#888', 12));
        return;
      }
    }
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffdd57';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r + 1, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,221,87,0.3)';
    ctx.fill();
  }
}

// --- Explosion Class ---
class Explosion {
  constructor(x, y, color, maxR) {
    this.x = x; this.y = y;
    this.color = color;
    this.maxR = maxR;
    this.r = 2;
    this.alive = true;
  }

  update() {
    this.r += 2;
    if (this.r > this.maxR) this.alive = false;
  }

  draw() {
    const alpha = 1 - this.r / this.maxR;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
    if (this.color.startsWith('#')) {
      ctx.fillStyle = this.color;
      ctx.globalAlpha = alpha;
    }
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// --- PowerUp Class ---
class PowerUp {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type;
    this.alive = true;
    this.r = 12;
    this.timer = 600;
  }

  update() {
    this.timer--;
    if (this.timer <= 0) this.alive = false;
  }

  draw() {
    const pulse = Math.sin(frameCount * 0.08) * 0.3 + 0.7;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    const colors = { heal: '#4eff4e', speed: '#4ea0ff', rapid: '#ffb84e' };
    ctx.fillStyle = colors[this.type];
    ctx.globalAlpha = pulse;
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    const labels = { heal: '+♥', speed: '⚡', rapid: '🔥' };
    ctx.fillText(labels[this.type], this.x, this.y + 4);
  }
}

// --- Map generation ---
function buildWalls() {
  walls = [];
  // Border walls
  for (let x = 0; x < COLS; x++) {
    walls.push({ x: x * TILE, y: 0, w: TILE, h: TILE, active: true });
    walls.push({ x: x * TILE, y: H - TILE, w: TILE, h: TILE, active: true });
  }
  for (let y = 1; y < ROWS - 1; y++) {
    walls.push({ x: 0, y: y * TILE, w: TILE, h: TILE, active: true });
    walls.push({ x: W - TILE, y: y * TILE, w: TILE, h: TILE, active: true });
  }

  // Inner walls - create interesting layout
  const layouts = [
    // Layout 1
    () => {
      const inner = [
        [3,1],[8,1],[13,1], [3,4],[8,4],[13,4],
        [5,2],[10,2],[11,2], [5,6],[10,6],[11,6],
        [1,3],[7,3],[15,3], [1,5],[7,5],[15,5],
        [3,7],[8,7],[13,7], [3,10],[8,10],[13,10],
        [5,8],[10,8], [5,10],[10,10],
        [3,3],[13,3],[3,8],[13,8],
      ];
      for (const [cx, cy] of inner) {
        walls.push({ x: cx * TILE, y: cy * TILE, w: TILE, h: TILE, active: true });
      }
    },
    // Layout 2
    () => {
      for (let y = 2; y < ROWS - 2; y += 2) {
        for (let x = 2; x < COLS - 2; x += 2) {
          if (Math.random() < 0.5) {
            walls.push({ x: x * TILE, y: y * TILE, w: TILE, h: TILE, active: true });
          }
        }
      }
    },
  ];

  const layout = layouts[Math.floor(Math.random() * layouts.length)];
  layout();

  // Ensure spawn areas are clear
  const clearZones = [
    { x: COLS/2 * TILE, y: ROWS - 1.5 * TILE }, // player spawn
  ];
  walls = walls.filter(w => {
    for (const z of clearZones) {
      if (Math.abs(w.x - z.x) < TILE * 2 && Math.abs(w.y - z.y) < TILE * 2) return false;
    }
    return true;
  });
}

function spawnPlayer() {
  player = new Tank(COLS / 2 * TILE, (ROWS - 1.5) * TILE, 'up', '#4eff4e', 2.5, true);
  player.shootDelay = 18;
}

function spawnEnemy() {
  const spawns = [
    [1.5 * TILE, 1.5 * TILE],
    [(COLS - 1.5) * TILE, 1.5 * TILE],
    [1.5 * TILE, (ROWS - 1.5) * TILE],
    [(COLS - 1.5) * TILE, (ROWS - 1.5) * TILE],
  ];

  const pos = spawns[Math.floor(Math.random() * spawns.length)];
  const dirs = ['up', 'down', 'left', 'right'];
  const dir = dirs[Math.floor(Math.random() * 4)];
  const enemy = new Tank(pos[0], pos[1], dir, '#ff4e4e', 1.3 + game.level * 0.15);
  enemy.shootDelay = Math.max(30, 90 - game.level * 8);
  return enemy;
}

// --- Game logic ---
function startGame() {
  game = {
    running: true,
    paused: false,
    score: 0,
    lives: 3,
    kills: 0,
    level: 1,
    enemySpawnTimer: 0,
    enemySpawnInterval: 140,
    maxEnemies: 4,
    totalEnemiesToKill: 10,
    enemiesKilledThisLevel: 0,
  };

  players = [];
  enemies = [];
  bullets = [];
  explosions = [];
  powerUps = [];
  keys = {};
  frameCount = 0;

  buildWalls();
  spawnPlayer();

  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  updateHUD();
  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score').textContent = game.score;
  const hearts = ['', '❤', '❤❤', '❤❤❤'];
  document.getElementById('lives').innerHTML = hearts[Math.min(game.lives, 3)] || '';
  document.getElementById('kills').textContent = game.kills;
}

function spawnExplosion(x, y, color = '#ff6b35', size = 20) {
  for (let i = 0; i < 6; i++) {
    explosions.push(new Explosion(
      x + (Math.random() - 0.5) * 20,
      y + (Math.random() - 0.5) * 20,
      color,
      size + Math.random() * 10
    ));
  }
}

function playerHit() {
  game.lives--;
  spawnExplosion(player.x, player.y, '#ff4e4e', 30);

  if (game.lives <= 0) {
    gameOver(false);
  } else {
    // Respawn player briefly invincible
    player.x = COLS / 2 * TILE;
    player.y = (ROWS - 1.5) * TILE;
    player.dir = 'up';
  }
  updateHUD();
}

function gameOver(won) {
  game.running = false;
  const overlay = document.getElementById('gameOverOverlay');
  overlay.classList.remove('hidden');
  document.getElementById('gameOverTitle').textContent = won ? '🎉 胜 利 🎉' : '战斗结束';
  document.getElementById('finalScore').textContent = game.score;
  document.getElementById('gameOverMsg').textContent = won
    ? `你成功消灭了所有敌人！\n消灭: ${game.kills} 辆坦克`
    : `你被击败了…\n消灭: ${game.kills} 辆坦克`;
}

function nextLevel() {
  game.level++;
  game.enemiesKilledThisLevel = 0;
  game.totalEnemiesToKill = 10 + game.level * 3;
  game.enemySpawnInterval = Math.max(40, 140 - game.level * 10);
  game.maxEnemies = Math.min(8, 4 + game.level);
  game.lives = Math.min(5, game.lives + 1);
  buildWalls();
  spawnPlayer();
  enemies = [];
  bullets = [];
  powerUps = [];
  updateHUD();
}

function handleInput() {
  if (!game.running || game.paused) return;

  const spd = player.speed;
  if (keys['ArrowUp'] || keys['KeyW']) player.move(0, -1, 'up');
  else if (keys['ArrowDown'] || keys['KeyS']) player.move(0, 1, 'down');
  else if (keys['ArrowLeft'] || keys['KeyA']) player.move(-1, 0, 'left');
  else if (keys['ArrowRight'] || keys['KeyD']) player.move(1, 0, 'right');

  if (keys['Space'] || keys['KeyJ']) {
    const b = player.shoot();
    if (b) bullets.push(b);
    keys['Space'] = false;
    keys['KeyJ'] = false;
  }
}

function update() {
  if (!game.running || game.paused) return;

  frameCount++;
  handleInput();

  // Player update
  player.update();

  // Check player-wall collision (pushing out)
  const wallHit = player.hitsWall();
  if (wallHit) {
    // Push player back
  }

  // Enemy spawning
  game.enemySpawnTimer++;
  if (enemies.length < game.maxEnemies &&
      game.enemiesKilledThisLevel + enemies.length < game.totalEnemiesToKill &&
      game.enemySpawnTimer >= game.enemySpawnInterval) {
    game.enemySpawnTimer = 0;
    const enemy = spawnEnemy();
    // Make sure spawn area is clear
    let blocked = false;
    for (const e of enemies) {
      if (enemy.collidesWith(e)) { blocked = true; break; }
    }
    if (player.collidesWith(enemy)) blocked = true;
    if (!blocked) enemies.push(enemy);
  }

  // Update enemies
  for (const enemy of enemies) {
    enemy.update();
    enemy.aiUpdate();

    // Enemy-player collision
    if (enemy.collidesWith(player)) {
      spawnExplosion(player.x, player.y, '#ff4e4e', 30);
      playerHit();
    }
  }

  // Enemy-enemy collision
  for (let i = 0; i < enemies.length; i++) {
    for (let j = i + 1; j < enemies.length; j++) {
      if (enemies[i].collidesWith(enemies[j])) {
        // Push apart
        const dx = enemies[j].x - enemies[i].x;
        const dy = enemies[j].y - enemies[i].y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        enemies[i].x -= dx / dist * 2;
        enemies[i].y -= dy / dist * 2;
        enemies[j].x += dx / dist * 2;
        enemies[j].y += dy / dist * 2;
      }
    }
  }

  // Update bullets
  for (const b of bullets) b.update();
  bullets = bullets.filter(b => b.alive);

  // Bullet-enemy collisions
  for (const b of bullets) {
    if (!b.alive || !b.owner.isPlayer) continue;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const dist = Math.hypot(b.x - e.x, b.y - e.y);
      if (dist < e.half) {
        b.alive = false;
        spawnExplosion(e.x, e.y, '#ff6b35', 25);
        enemies.splice(i, 1);
        game.score += 100;
        game.kills++;
        game.enemiesKilledThisLevel++;

        // Chance to drop power-up
        if (Math.random() < 0.15) {
          const types = ['heal', 'speed', 'rapid'];
          const type = types[Math.floor(Math.random() * types.length)];
          powerUps.push(new PowerUp(e.x, e.y, type));
        }

        updateHUD();

        // Check level complete
        if (game.enemiesKilledThisLevel >= game.totalEnemiesToKill && enemies.length === 0) {
          game.score += 500;
          updateHUD();
          setTimeout(nextLevel, 1000);
        }
        break;
      }
    }
  }

  // Bullet-player collisions
  for (const b of bullets) {
    if (!b.alive || b.owner.isPlayer) continue;
    const dist = Math.hypot(b.x - player.x, b.y - player.y);
    if (dist < player.half) {
      b.alive = false;
      playerHit();
    }
  }

  // Update explosions
  for (const e of explosions) e.update();
  explosions = explosions.filter(e => e.alive);

  // Update power-ups
  for (const p of powerUps) p.update();
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const p = powerUps[i];
    const dist = Math.hypot(p.x - player.x, p.y - player.y);
    if (dist < p.r + player.half) {
      if (p.type === 'heal') game.lives = Math.min(5, game.lives + 1);
      if (p.type === 'speed') player.speed = Math.min(5, player.speed + 0.8);
      if (p.type === 'rapid') player.shootDelay = Math.max(5, player.shootDelay - 5);
      powerUps.splice(i, 1);
      updateHUD();
    }
  }
  powerUps = powerUps.filter(p => p.alive);
}

function drawGrid() {
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= W; x += TILE) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += TILE) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, W, H);
  drawGrid();

  // Walls
  for (const w of walls) {
    if (!w.active) continue;
    ctx.fillStyle = '#3d5a80';
    ctx.fillRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
    ctx.fillStyle = '#4a6fa5';
    ctx.fillRect(w.x + 4, w.y + 4, w.w - 8, w.h - 8);
    ctx.strokeStyle = '#2c4a6e';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(w.x + 4, w.y + 4, w.w - 8, w.h - 8);
  }

  // Power-ups
  for (const p of powerUps) p.draw();

  // Bullets
  for (const b of bullets) b.draw();

  // Explosions
  for (const e of explosions) e.draw();

  // Enemies
  for (const enemy of enemies) enemy.draw();

  // Player
  if (player.alive) player.draw();

  // Pause overlay
  if (game.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f5c518';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('暂 停', W / 2, H / 2);
  }

  // Level indicator
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`第 ${game.level} 关  剩余敌人: ${game.totalEnemiesToKill - game.enemiesKilledThisLevel - enemies.length}`, W - 20, 25);
}

function gameLoop() {
  update();
  draw();
  if (game.running) {
    requestAnimationFrame(gameLoop);
  }
}

// --- Input handling ---
document.addEventListener('keydown', e => {
  keys[e.code] = true;

  if (e.code === 'KeyP') {
    game.paused = !game.paused;
  }

  // Prevent scrolling
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
    e.preventDefault();
  }
});

document.addEventListener('keyup', e => {
  keys[e.code] = false;
});

// Prevent double-tap zoom on mobile
document.addEventListener('touchstart', e => {
  if (e.target === canvas) e.preventDefault();
}, { passive: false });

// --- Initial render ---
buildWalls();
spawnPlayer();
updateHUD();
draw();
</script>
</body>
</html>
